<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título SEO alineado a e-commerce -->
  <title>NORTE | Moda y Accesorios de Diseño Local</title>

  <!-- Metadatos SEO básicos -->
  <meta name="description"
    content="Diseño local, prendas y accesorios de producción consciente. Colecciones propias y marcas afines en NORTE." />
  <meta name="robots" content="index, follow" />
  <!-- Color de acento o base de la marca (#1C1B19) -->
  <meta name="theme-color" content="#1C1B19" />

  <!-- Favicon principal dinámico (SVG) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Tamaños estándar en PNG y fallback ICO -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- Para dispositivos iOS (Apple) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Para dispositivos Android y accesos directos PWA -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph / Redes Sociales y WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NORTE" />
  <meta property="og:title" content="NORTE | Moda y Accesorios de Diseño Local" />
  <meta property="og:description"
    content="Ropa, accesorios y curaduría de diseño independiente. Compra directa y envíos a todo el país." />

  <!-- imágenes Open Graph: primero la cuadrada (iMessage/WhatsApp/Telegram
       usan la primera og:image y recortan la apaisada) y luego la 1200x630 -->
  <meta property="og:image" content="https://norte-project.vercel.app/og-image-square.png" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="600" />
  <meta property="og:image:alt" content="NORTE — Moda y accesorios de diseño local" />

  <meta property="og:image" content="https://norte-project.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="NORTE — Moda y accesorios de diseño local" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NORTE | Diseño Local" />
  <meta name="twitter:description"
    content="Ropa, accesorios y curaduría de diseño independiente. Compra directa y envíos a todo el país." />
  <meta name="twitter:image" content="https://norte-project.vercel.app/og-image.png" />

  <!-- Fuentes del design system: Roboto (body) + Roboto Condensed (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
