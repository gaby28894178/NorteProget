<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título SEO alineado a e-commerce -->
  <title>NORTE | Moda y Accesorios de Diseño Local</title>

  <!-- Metadatos SEO básicos -->
  <meta name="description"
    content="Diseño local, prendas y accesorios de producción consciente. Colecciones propias y marcas afines en NORTE." />
  <meta name="robots" content="index, follow" />
  <!-- Color de acento o base de la marca (#1C1B19) -->
  <meta name="theme-color" content="#1C1B19" />

  <!-- Favicon e Iconos (ubicados en public/) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Open Graph / Redes Sociales y WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="NORTE | Moda y Accesorios de Diseño Local" />
  <meta property="og:description"
    content="Ropa, accesorios y curaduría de diseño independiente. Compra directa y envíos a todo el país." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="NORTE — Moda y accesorios de diseño local" />

  <!-- Imagen cuadrada para WhatsApp y compartir en dispositivos móviles -->
  <meta property="og:image" content="/og-image-square.png" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="600" />
  <meta property="og:image:alt"
    content="NORTE — Moda y accesorios de diseño local" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NORTE | Diseño Local" />
  <meta name="twitter:description" content="Ropa, accesorios y curaduría de diseño independiente. Compra directa y envíos a todo el país." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Fuentes del design system: Roboto (body) + Roboto Condensed (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
